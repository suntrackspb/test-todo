services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      NOTES_JWT_SECRET: ${NOTES_JWT_SECRET:-change-me-in-production}
    volumes:
      - notes-data:/data
    expose:
      - "8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  notes-data:
