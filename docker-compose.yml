services:
  backend:
    image: ghcr.io/suntrackspb/test-todo-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NOTES_JWT_SECRET: ${NOTES_JWT_SECRET:-change-me-in-production}
    volumes:
      - notes-data:/data
    expose:
      - "8000"

  frontend:
    image: ghcr.io/suntrackspb/test-todo-frontend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  notes-data:
