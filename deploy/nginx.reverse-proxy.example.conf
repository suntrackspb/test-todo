# Пример конфига nginx на ХОСТЕ (вне docker-compose), который проксирует
# внешний домен на контейнер frontend, слушающий на localhost:8080.
#
# Используется, когда приложение крутится по адресу http://localhost:8080
# (см. docker-compose.yml) и нужно отдать его наружу по домену с HTTPS,
# например через certbot.
#
# Установка (Debian/Ubuntu):
#   sudo cp deploy/nginx.reverse-proxy.example.conf /etc/nginx/sites-available/notes.conf
#   sudo ln -s /etc/nginx/sites-available/notes.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d notes.example.com   # выпустит сертификат и допишет ssl-блок

upstream notes_app {
    server 127.0.0.1:8080;
}

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # Раскомментируйте после certbot --nginx, чтобы редиректить http -> https
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass http://notes_app;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Загрузка изображений/рисунков может быть довольно объёмной
        client_max_body_size 20m;
    }
}

# Блок для HTTPS. certbot --nginx добавит его автоматически, либо
